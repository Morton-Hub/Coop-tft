name: Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Le projet Android est généré à partir de capacitor.config.json, il n'est pas versionné.
      - run: npx cap add android
      # Clé de debug fixe : les mises à jour s'installent par-dessus la version précédente.
      - run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk coop-tft.apk
      # Facultatif : ne doit pas bloquer la publication si le quota d'artefacts du compte est plein.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coop-tft-apk
          path: coop-tft.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest coop-tft.apk --target "$GITHUB_SHA" \
            --title "Coop TFT (dernière version)" \
            --notes "APK Android construit depuis main (${GITHUB_SHA::7})."
